<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real OTP Authentication</title>

  <!-- Include EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-header h2 {
      font-size: 24px;
      color: #1a1d20;
      margin-bottom: 8px;
    }

    .auth-header p {
      font-size: 14px;
      color: #6c757d;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #343a40;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .otp-container {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 20px;
    }

    .otp-input {
      width: 48px;
      height: 52px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      border: 1px solid #ced4da;
      border-radius: 6px;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #0d6efd;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .submit-btn:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="auth-card">

    <!-- Step 1: Send OTP Screen -->
    <div id="email-step">
      <div class="auth-header">
        <h2>Sign In with OTP</h2>
        <p>Enter your email to receive a real verification code.</p>
      </div>

      <form id="request-otp-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="name@company.com" required />
        </div>
        <button type="submit" id="send-btn" class="submit-btn">Send OTP Code</button>
      </form>
    </div>

    <!-- Step 2: Verify OTP Screen -->
    <div id="otp-step" class="hidden">
      <div class="auth-header">
        <h2>Verify OTP</h2>
        <p>Enter the 6-digit code sent to <br><b id="target-email"></b></p>
      </div>

      <form id="verify-otp-form">
        <div class="otp-container">
          <input type="text" class="otp-input" maxlength="1" required />
          <input type="text" class="otp-input" maxlength="1" required />
          <input type="text" class="otp-input" maxlength="1" required />
          <input type="text" class="otp-input" maxlength="1" required />
          <input type="text" class="otp-input" maxlength="1" required />
          <input type="text" class="otp-input" maxlength="1" required />
        </div>
        <button type="submit" class="submit-btn">Verify & Sign In</button>
      </form>
    </div>

  </div>

  <script>
    // 1. Initialize EmailJS with your Public Key
    const PUBLIC_KEY = "mxDQQ2yK3yNUjucKv";
    const SERVICE_ID = "service_hhl1o9l";
    const TEMPLATE_ID = "template_rqwbizl";

    emailjs.init(PUBLIC_KEY);

    let generatedOtp = null;

    const emailStep = document.getElementById('email-step');
    const otpStep = document.getElementById('otp-step');
    const targetEmail = document.getElementById('target-email');
    const otpInputs = document.querySelectorAll('.otp-input');
    const sendBtn = document.getElementById('send-btn');

    // Auto-focus next box in 6-digit input
    otpInputs.forEach((input, index) => {
      input.addEventListener('keyup', (e) => {
        if (e.key >= 0 && e.key <= 9) {
          if (index < otpInputs.length - 1) otpInputs[index + 1].focus();
        } else if (e.key === 'Backspace') {
          if (index > 0) otpInputs[index - 1].focus();
        }
      });
    });

    // 2. Handle Request OTP (Generates random 6-digit code & sends email)
    document.getElementById('request-otp-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;

      // Generate a random 6-digit number
      generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();

      sendBtn.innerText = "Sending email...";
      sendBtn.disabled = true;

      try {
        // Send email via EmailJS
        await emailjs.send(SERVICE_ID, TEMPLATE_ID, {
          to_email: email,
          otp_code: generatedOtp
        });

        alert("OTP sent successfully to your inbox!");
        targetEmail.innerText = email;

        // Switch to OTP view
        emailStep.classList.add('hidden');
        otpStep.classList.remove('hidden');
        otpInputs[0].focus();

      } catch (error) {
        alert("Failed to send OTP email: " + JSON.stringify(error));
        sendBtn.innerText = "Send OTP Code";
        sendBtn.disabled = false;
      }
    });

    // 3. Handle Verify OTP
    document.getElementById('verify-otp-form').addEventListener('submit', (e) => {
      e.preventDefault();
      let enteredOtp = "";
      otpInputs.forEach(input => enteredOtp += input.value);

      if (enteredOtp === generatedOtp) {
        alert("🎉 Success! OTP verified. You are now logged in.");
      } else {
        alert("❌ Incorrect OTP code. Please check your email and try again.");
      }
    });
  </script>
</body>

</html>
